<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="技术文章分类 - 编程、算法、工程">
    <title>文章 - Kirito's blog</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        /* Navigation */
        nav {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
        }

        nav a {
            text-decoration: none;
            color: #667eea;
            font-weight: 600;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #764ba2;
        }

        /* Main Content */
        main {
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .categories {
            margin-bottom: 50px;
        }

        .categories h2 {
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .category-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 25px;
            transition: transform 0.3s, box-shadow 0.3s;
            border-left: 4px solid #667eea;
            cursor: pointer;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
        }

        .category-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.5em;
        }

        .category-card p {
            color: #666;
            margin-bottom: 15px;
        }

        .category-card a {
            text-decoration: none;
            color: #667eea;
            font-weight: 600;
            display: inline-block;
            margin-top: 10px;
        }

        .subcategories {
            margin-top: 15px;
            padding-left: 20px;
        }

        .subcategories a {
            display: block;
            color: #764ba2;
            padding: 5px 0;
            text-decoration: none;
            transition: padding-left 0.3s;
        }

        .subcategories a:hover {
            padding-left: 10px;
            color: #667eea;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px;
            color: white;
            margin-top: 40px;
        }

        footer a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            transition: opacity 0.3s;
        }

        footer a:hover {
            opacity: 0.8;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2em;
            }

            main {
                padding: 20px;
            }

            .categories-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 文章分类</h1>
            <p>选择您感兴趣的主题</p>
        </header>

        <nav>
            <ul>
                <li><a href="index.html">首页</a></li>
                <li><a href="articles.html">文章</a></li>
                <li><a href="about.html">关于</a></li>
                <li><a href="https://github.com/Kiritobl" target="_blank">GitHub</a></li>
            </ul>
        </nav>

        <main>
            <section class="categories">
                <h2>📚 文章分类</h2>
                <div class="categories-grid">
                    <!-- Programming Category -->
                    <div class="category-card">
                        <h3>💻 编程</h3>
                        <p>各种编程语言的学习心得、代码示例和最佳实践</p>
                        <div class="subcategories">
                            <a href="articles/programming/cpp.html">→ C++ 编程</a>
                            <a href="articles/programming/java.html">→ Java 编程</a>
                            <a href="articles/programming/python.html">→ Python 编程</a>
                        </div>
                    </div>

                    <!-- Algorithms Category -->
                    <div class="category-card">
                        <h3>🧮 算法</h3>
                        <p>算法设计、数据结构、问题解决方法和算法分析</p>
                        <a href="articles/algorithms.html">查看所有算法文章 →</a>
                    </div>

                    <!-- Engineering Category -->
                    <div class="category-card">
                        <h3>🏗️ 工程</h3>
                        <p>软件工程实践、系统设计、项目管理和开发流程</p>
                        <a href="articles/engineering.html">查看所有工程文章 →</a>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2025 Kirito's Blog. All rights reserved.</p>
            <div>
                <a href="https://github.com/Kiritobl" target="_blank">GitHub</a>
                <a href="mailto:your-email@example.com">Email</a>
            </div>
        </footer>
    </div>
</body>
</html>
